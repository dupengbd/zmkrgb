# ============================================================
# ZMK 键盘固件配置文件 (合并 sofle + zmkdp)
# ============================================================

# ============================================================
# 设备信息
# ============================================================
CONFIG_BT_DEVICE_NAME="Yin LeYu"

# ============================================================
# 编码器（旋钮）
# ============================================================
CONFIG_EC11=y
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y

# ============================================================
# OLED 屏幕 (使用 codekeeb/zmk-nice-oled 自定义 fork)
# ============================================================
CONFIG_ZMK_DISPLAY=y
CONFIG_ZMK_DISPLAY_STATUS_SCREEN_CUSTOM=y

# 外围 OLED 运行时可切换动画 (&oledanim)
CONFIG_NICE_OLED_WIDGET_ANIMATION_PERIPHERAL_SELECTABLE=y
# 电池图形图标显示
CONFIG_NICE_OLED_WIDGET_BATTERY_GRAPHIC=y

# ============================================================
# ZMK Studio（在线配置工具）
# ============================================================
# Studio 仅在 build.yaml 中通过 cmake-args 对 left 启用
# 不要在此处全局启用，否则会影响外围设备电源管理

# ============================================================
# 电池与电量显示
# ============================================================
CONFIG_ZMK_BATTERY=y
CONFIG_BT_BAS=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y
CONFIG_ZMK_BATTERY_REPORT_INTERVAL=30

# ============================================================
# 高压 DCDC（驱动 WS2812 LED 需要电感供电）
# ============================================================
CONFIG_BOARD_ENABLE_DCDC_HV=y

# ============================================================
# 蓝牙性能优化
# ============================================================
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y
CONFIG_BT_PERIPHERAL_PREF_LATENCY=10
CONFIG_BT_PERIPHERAL_PREF_TIMEOUT=500

# ============================================================
# 鼠标功能 (用于 &mwheel 行为和编码器滚轮)
# ============================================================
CONFIG_ZMK_POINTING=y

# ============================================================
# RGB FX (替换 ZMK 原生 underglow，使用 sofle 的自定义引擎)
# ============================================================
CONFIG_ZMK_RGB_UNDERGLOW=n
CONFIG_SPI=y
CONFIG_LED_STRIP=y
CONFIG_WS2812_STRIP=y
CONFIG_ZMK_RGB_FX=y

# ============================================================
# 按键防抖
# ============================================================
CONFIG_ZMK_KSCAN_DEBOUNCE_PRESS_MS=5
CONFIG_ZMK_KSCAN_DEBOUNCE_RELEASE_MS=5
